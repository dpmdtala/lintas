<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINTAS API Bridge</title></head><body><script>
(function(){
 'use strict';
 // Origin frontend GitHub Pages. Jangan gunakan wildcard untuk otorisasi pesan.
 var ALLOWED_ORIGIN='https://dpmdtala.github.io';
 var ALLOWED=new Set(['login','logout','getInitialData','getOfficialStatuses','getPublicPageUrl','getServerClock','listIncoming','listOutgoing','listVisitorsForFrontOffice','saveIncoming','saveOfficialStatus','saveOutgoing','getScanUrl','updateIncomingStatus','getIncomingSummaryForSiap','getDailyIncomingSummaryForSiap','sendIncomingSummaryToSiap','getIkmQuarterlyReport','generateIkmAnalysis']);
 function reply(target,origin,id,ok,value){target.postMessage({channel:'LINTAS_BRIDGE_V1',id:id,ok:ok,result:ok?value:undefined,error:ok?undefined:String(value&&value.message||value||'Permintaan gagal')},origin);}
 function ready(origin){window.parent.postMessage({channel:'LINTAS_BRIDGE_READY'},origin);}
 window.addEventListener('message',function(ev){
   if(ev.origin!==ALLOWED_ORIGIN||ev.source!==window.parent)return;
   var m=ev.data;if(!m)return;
   if(m.channel==='LINTAS_BRIDGE_PING'){ready(ev.origin);return;}
   if(m.channel!=='LINTAS_BRIDGE_V1'||typeof m.id!=='string'||!ALLOWED.has(m.fn)||!Array.isArray(m.args))return;
   if(m.args.length>8)return reply(ev.source,ev.origin,m.id,false,'Jumlah argumen tidak valid.');
   try{
     var runner=google.script.run.withSuccessHandler(function(v){reply(ev.source,ev.origin,m.id,true,v);}).withFailureHandler(function(e){reply(ev.source,ev.origin,m.id,false,e);});
     var fn=runner[m.fn];
     if(typeof fn!=='function')return reply(ev.source,ev.origin,m.id,false,'Fungsi backend tidak ditemukan: '+m.fn);
     fn.apply(runner,m.args);
   }catch(e){reply(ev.source,ev.origin,m.id,false,e);}
 });
 // Pesan awal bersifat best-effort; frontend akan melakukan ping berulang sampai siap.
 ready(ALLOWED_ORIGIN);
})();
</script></body></html>
